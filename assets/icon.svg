<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2430"/>
      <stop offset="0.55" stop-color="#11151e"/>
      <stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#45e0ff"/>
      <stop offset="0.5" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#a16bff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.47" r="0.5">
      <stop offset="0" stop-color="#4a7dff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#4a7dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- 深色玻璃圆角底 -->
  <rect x="64" y="64" width="896" height="896" rx="210" ry="210" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="210" ry="210" fill="url(#sheen)"/>
  <rect x="66" y="66" width="892" height="892" rx="208" ry="208" fill="none" stroke="url(#edge)" stroke-width="4"/>

  <!-- 中心光晕 -->
  <circle cx="512" cy="488" r="320" fill="url(#glow)" filter="url(#soft)"/>

  <!-- 盘：一道开口的圆环，开口朝右 -->
  <path d="M 699.3 343.4 A 252 252 0 1 0 699.3 680.6"
        fill="none" stroke="url(#mark)" stroke-width="64" stroke-linecap="round"/>

  <!-- 代码箭头：从盘心穿过开口指出去，尖端抵在开口内侧 -->
  <path d="M 476 372 L 684 512 L 476 652"
        fill="none" stroke="url(#mark)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
