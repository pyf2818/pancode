<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgA" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#FCFEFD"/>
      <stop offset="0.42" stop-color="#EEF8F5"/>
      <stop offset="1" stop-color="#DFEDF3"/>
    </linearGradient>
    <linearGradient id="markA" x1="0.15" y1="0.02" x2="0.85" y2="1">
      <stop offset="0" stop-color="#37C4A6"/>
      <stop offset="0.5" stop-color="#3FA3DB"/>
      <stop offset="1" stop-color="#6A7CD3"/>
    </linearGradient>
    <linearGradient id="glossA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- 底座边缘：浅色图标在浅色任务栏上会"融掉"，必须有明确的边界 -->
    <linearGradient id="rimA" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#C3DCE2" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8FB0BE" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect x="52" y="52" width="920" height="920" rx="216" fill="url(#bgA)"/>
  <rect x="52" y="52" width="920" height="920" rx="216" fill="url(#glossA)" opacity="0.5"/>
  <rect x="54" y="54" width="916" height="916" rx="214" fill="none" stroke="url(#rimA)" stroke-width="8"/>

  <!-- P：竖笔与碗部共用起点，碗部弧线不被竖笔穿出（上一版像 R） -->
  <path d="M 376 720 L 376 318" fill="none" stroke="url(#markA)" stroke-width="46" stroke-linecap="round"/>
  <path d="M 376 318 C 508 300 700 342 700 456 C 700 570 508 610 376 592"
        fill="none" stroke="url(#markA)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 代码箭头：右下，小而含蓄 -->
  <path d="M 604 660 L 680 714 L 604 768"
        fill="none" stroke="url(#markA)" stroke-width="38"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- 一点光标 -->
  <circle cx="758" cy="714" r="19" fill="url(#markA)" opacity="0.7"/>
</svg>
